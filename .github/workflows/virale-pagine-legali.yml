# Pubblica su GitHub Pages i documenti legali di Virale (privacy, termini, linee guida,
# eliminazione account): gli store chiedono indirizzi pubblici per questi documenti.
# Attivazione una tantum: Settings → Pages → Source: "GitHub Actions".
name: Virale · pagine legali

on:
  push:
    branches: [main]
    paths: ['virale/src/legal/**', 'virale/scripts/export-legal.ts', '.github/workflows/virale-pagine-legali.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: virale-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Genera le pagine
        working-directory: virale
        run: npm run export:legal
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: virale/legal-site
      - id: deployment
        uses: actions/deploy-pages@v4
