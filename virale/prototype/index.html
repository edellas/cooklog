<title>Virale · prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700;6..96,900&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/*
  Layout: tavolo luminoso d'inchiostro. A sinistra il percorso (i capitoli del flusso),
  al centro il telefono con le schermate vere, a destra la spiegazione del passaggio.
  Mondo unico scuro, come l'app: i colori sono tutti espliciti.
*/
:root {
  color-scheme: dark;
  --canvas: #0C1322;      /* oklch(0.19 0.032 264) inchiostro */
  --raised: #151D2D;      /* oklch(0.23 0.034 264) */
  --sheet: #1E2637;       /* oklch(0.27 0.034 264) */
  --line: #3A4253;        /* oklch(0.38 0.03 264) */
  --paper: #F5F3EE;       /* oklch(0.965 0.008 95) carta */
  --paper-dim: #C1C8D5;
  --paper-faint: #939CAC;
  --giallo: #FADB2C;      /* oklch(0.89 0.175 98) giallo stampa */
  --matita: #F65041;      /* oklch(0.66 0.205 29) matita grassa */
  --scrim: rgba(8, 12, 22, 0.55);
  --table: #070B14;
  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --ui: 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--table);
  color: var(--paper);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
::selection { background: var(--giallo); color: var(--canvas); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--giallo); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

/* ---------- impaginato della pagina ---------- */
.app {
  min-height: 100%;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr) 380px;
  grid-template-rows: auto 1fr;
  gap: 0 32px;
  max-width: 1440px;
  margin: 0 auto;
  padding-block: 20px;
}
.top {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.brand b { font-family: var(--display); font-weight: 900; font-size: 34px; letter-spacing: -1px; line-height: 1; }
.brand span { color: var(--paper-faint); font-size: 14px; }
.progress { display: flex; align-items: center; gap: 14px; }
.count { font-size: 14px; color: var(--paper-dim); white-space: nowrap; }
.count strong { color: var(--paper); font-weight: 700; }
.bar { width: 160px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--giallo); transform-origin: left; transition: transform 300ms var(--ease-out); }

.flow { align-self: start; position: sticky; top: 20px; display: flex; flex-direction: column; gap: 18px; }
.chapter h3 { font-family: var(--display); font-weight: 700; font-size: 19px; margin-bottom: 6px; }
.chapter ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.chapter button {
  width: 100%;
  display: flex;
  gap: 10px;
  align-items: baseline;
  text-align: left;
  padding: 7px 10px;
  border-radius: 10px;
  color: var(--paper-faint);
  font-size: 14px;
  transition: background-color 150ms ease, color 150ms ease;
}
.chapter button .n { font-size: 12px; min-width: 18px; color: var(--paper-faint); }
.chapter button[aria-current='step'] { background: var(--raised); color: var(--paper); }
.chapter button[aria-current='step'] .n { color: var(--giallo); }
.chapter button.done { color: var(--paper-dim); }
@media (hover: hover) and (pointer: fine) { .chapter button:hover { color: var(--paper); } }

.stage { display: flex; align-items: flex-start; justify-content: center; min-width: 0; }
.notes { align-self: start; position: sticky; top: 20px; display: flex; flex-direction: column; gap: 20px; }
.notes h2 { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.05; letter-spacing: -0.5px; }
.notes .lead { font-size: 18px; line-height: 1.5; color: var(--paper); max-width: 60ch; }
.notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.notes li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; color: var(--paper-dim); font-size: 15px; }
.notes li svg { margin-top: 2px; }
.nav { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 14px; background: var(--raised); color: var(--paper); font-weight: 700; font-size: 15px;
  transition: transform 120ms var(--ease-out), background-color 150ms ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--giallo); color: var(--canvas); }
.btn[disabled] { opacity: 0.35; pointer-events: none; }
.hint { font-size: 13px; color: var(--paper-faint); }
.notes-body { display: flex; flex-direction: column; gap: 20px; transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
.notes-body.out { opacity: 0; transform: translateY(6px); }

/* ---------- il telefono ---------- */
.device { --s: 1; width: calc(390px * var(--s) + 24px * var(--s)); height: calc(844px * var(--s) + 24px * var(--s)); position: relative; flex: none; }
.bezel {
  position: absolute; left: 0; top: 0; width: 414px; height: 868px; transform: scale(var(--s)); transform-origin: top left;
  border-radius: 64px; background: #1B1F27; padding: 12px;
  box-shadow: 0 40px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px #2E3440 inset;
}
.phone {
  position: relative; width: 390px; height: 844px; border-radius: 54px; overflow: hidden; background: var(--canvas);
  font-family: var(--ui); color: var(--paper); isolation: isolate;
}
.island { position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; background: #000; border-radius: 20px; z-index: 50; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 40; display: flex; justify-content: space-between; align-items: center; padding: 6px 30px 0 36px; font-weight: 700; font-size: 16px; pointer-events: none; }
.status .sys { display: flex; gap: 6px; align-items: center; }
.homebar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--paper); z-index: 60; opacity: 0.9; pointer-events: none; }
.screen { position: absolute; inset: 0; }
.screen.enter { animation: screenIn 260ms var(--ease-out) both; }
@keyframes screenIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.screen.fade { animation: fadeIn 220ms var(--ease-out) both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* hotspot: come i suggerimenti di un prototipo Figma */
.hot {
  position: absolute; z-index: 80; border-radius: 16px; cursor: pointer;
  box-shadow: 0 0 0 2px var(--giallo), 0 0 0 6px rgba(250, 219, 44, 0.25);
  animation: hotPulse 1.8s var(--ease-out) infinite;
}
.hot span {
  position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); white-space: nowrap;
  background: var(--giallo); color: var(--canvas); font-weight: 700; font-size: 13px; padding: 5px 10px; border-radius: 8px;
}
.hot.below span { bottom: auto; top: calc(100% + 8px); }
@keyframes hotPulse { 0%, 100% { box-shadow: 0 0 0 2px var(--giallo), 0 0 0 4px rgba(250, 219, 44, 0.35); } 50% { box-shadow: 0 0 0 2px var(--giallo), 0 0 0 10px rgba(250, 219, 44, 0); } }

/* ---------- componenti dell'app ---------- */
.txt-meta { font-size: 12px; line-height: 16px; font-weight: 500; }
.txt-small { font-size: 14px; line-height: 20px; }
.txt-label { font-size: 15px; line-height: 20px; font-weight: 700; }
.txt-title { font-size: 20px; line-height: 25px; font-weight: 700; letter-spacing: -0.2px; }
.txt-heading { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 34px; letter-spacing: -0.4px; }
.dim { color: var(--paper-dim); } .faint { color: var(--paper-faint); }
.mast { font-family: var(--display); font-weight: 900; letter-spacing: -0.03em; line-height: 1; display: inline-flex; }
.mast i { font-style: normal; display: inline-block; }
.mast.reveal i { animation: letterUp 360ms var(--ease-out) both; }
@keyframes letterUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--canvas); border-top: 1px solid rgba(58, 66, 83, 0.7); display: flex; padding: 8px 4px 0; z-index: 20; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--paper-faint); font-size: 11px; font-weight: 500; }
.tab.on { color: var(--paper); }
.tab .plus { width: 52px; height: 36px; border-radius: 14px; background: var(--giallo); display: grid; place-items: center; margin-top: 4px; }

.frame { position: relative; border-radius: 22px; overflow: hidden; background: var(--raised); }
.slides { position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; height: 100%; scroll-snap-align: start; position: relative; }
.slide img, .slide video { width: 100%; height: 100%; object-fit: cover; display: block; }
.counter { position: absolute; top: 12px; right: 12px; background: var(--scrim); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 500; }
.dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
.dots b { width: 6px; height: 6px; border-radius: 3px; background: rgba(245, 243, 238, 0.45); transition: width 180ms var(--ease-out), background-color 180ms ease; }
.dots b.on { width: 16px; background: var(--paper); }
.stamp { position: absolute; left: 12px; bottom: 14px; background: var(--giallo); color: var(--canvas); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 700; transform: rotate(-2deg); }
.sound { position: absolute; top: 12px; left: 12px; width: 36px; height: 36px; border-radius: 18px; background: var(--scrim); display: grid; place-items: center; }
.track { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(245, 243, 238, 0.2); }
.track i { display: block; height: 100%; background: var(--giallo); transform-origin: left; transform: scaleX(0); }
.mark { position: absolute; width: 150px; height: 150px; pointer-events: none; transition: opacity 220ms var(--ease-out); }
.mark path { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 420ms var(--ease-out) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.mono { border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: var(--canvas); flex: none; }
.strip { display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }
.author { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.author .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.follow { border: 1px solid var(--paper); border-radius: 999px; padding: 5px 14px; font-size: 12px; font-weight: 700; }
.actions { display: flex; gap: 20px; align-items: center; margin-top: 2px; }
.act { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--paper-dim); min-height: 32px; }
.act.on-red { color: var(--matita); } .act.on-yellow { color: var(--giallo); }

.seg { position: relative; display: flex; width: 210px; padding: 4px; border-radius: 999px; background: var(--raised); }
.seg .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--paper); transition: transform 180ms var(--ease-out); }
.seg.right .pill { transform: translateX(100%); }
.seg button { position: relative; flex: 1; padding: 8px 0; font-size: 15px; font-weight: 700; color: var(--paper-dim); transition: color 180ms ease; }
.seg button.on { color: var(--canvas); }
.clock { display: inline-flex; align-items: center; gap: 6px; background: var(--raised); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 700; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); border-radius: 24px 24px 0 0; z-index: 30; transform: translateY(100%); transition: transform 320ms var(--ease-sheet); box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35); }
.sheet.open { transform: translateY(0); }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.backdrop { position: absolute; inset: 0; background: rgba(5, 8, 15, 0.5); z-index: 25; opacity: 0; transition: opacity 260ms var(--ease-out); }
.backdrop.open { opacity: 1; }
.field { display: flex; align-items: center; gap: 6px; background: var(--raised); border: 1.5px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 48px; font-size: 16px; }
.field.focus { border-color: var(--giallo); }
.caret { display: inline-block; width: 2px; height: 20px; background: var(--giallo); animation: blink 1s steps(2) infinite; vertical-align: middle; }
@keyframes blink { 50% { opacity: 0; } }
.cta { display: grid; place-items: center; min-height: 52px; border-radius: 14px; background: var(--giallo); color: var(--canvas); font-weight: 700; font-size: 15px; }
.cta.ghost { background: var(--raised); color: var(--paper); }

.ladder { display: flex; flex-direction: column; gap: 10px; }
.steps { display: flex; gap: 4px; }
.steps b { flex: 1; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; position: relative; }
.steps b i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--giallo); border-radius: 6px; transition: width 600ms var(--ease-out); }
.steps b.final i { background: var(--matita); }
.tiers { font-size: 12px; color: var(--paper-faint); }
.tiers .now { color: var(--giallo); font-weight: 700; } .tiers .past { color: var(--paper); }

.wall { position: absolute; inset: 0; display: flex; gap: 8px; padding: 0 4px; opacity: 0.9; }
.wall .col { flex: 1; display: flex; flex-direction: column; gap: 8px; animation: wallUp 64s linear infinite; }
.wall .col.rev { animation: wallDown 52s linear infinite; }
.wall img { width: 100%; height: 252px; object-fit: cover; border-radius: 12px; display: block; }
@keyframes wallUp { to { transform: translateY(-50%); } }
@keyframes wallDown { from { transform: translateY(-50%); } to { transform: translateY(0); } }

.pin { width: 170px; height: 255px; border-radius: 14px; border: 6px solid var(--paper); background: var(--paper); overflow: hidden; animation: pinIn 420ms var(--ease-out) both; }
.pin img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 8px; }
@keyframes pinIn { from { opacity: 0; transform: scale(0.92) rotate(-7deg); } to { opacity: 1; transform: scale(1) rotate(-2deg); } }

.dialog { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; padding: 24px; background: rgba(5, 8, 15, 0.7); animation: fadeIn 220ms var(--ease-out) both; }
.dialog > div { width: 100%; background: var(--sheet); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: pop 260ms var(--ease-out) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: none; } }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 12px; }
.mini { position: relative; aspect-ratio: 2 / 3; border-radius: 16px; overflow: hidden; background: var(--raised); }
.mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini .m { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: -1px; line-height: 1; text-shadow: 0 1px 10px rgba(8, 12, 22, 0.7); }
.mini .n { position: absolute; left: 8px; bottom: 8px; background: var(--giallo); color: var(--canvas); border-radius: 6px; padding: 2px 6px; font-size: 12px; font-weight: 700; }

/* slide "dietro le quinte" */
.board { width: 100%; max-width: 760px; background: var(--canvas); border: 1px solid var(--line); border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 26px; }
.funnel { display: flex; flex-direction: column; gap: 10px; }
.funnel .row { display: grid; grid-template-columns: 120px 1fr 92px; align-items: center; gap: 14px; font-size: 14px; }
.funnel .row b { height: 28px; border-radius: 8px; background: var(--giallo); transform-origin: left; animation: grow 700ms var(--ease-out) both; }
.funnel .row.final b { background: var(--matita); }
.funnel .row span:last-child { text-align: right; font-weight: 700; }
@keyframes grow { from { transform: scaleX(0.02); } to { transform: scaleX(1); } }
.weights { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.weights div { background: var(--raised); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.weights strong { font-family: var(--display); font-size: 26px; line-height: 1.1; }
.weights .neg strong { color: var(--matita); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fact { background: var(--raised); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.fact strong { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--giallo); }
.checks { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; font-size: 14px; color: var(--paper-dim); }
.checks li { display: flex; gap: 8px; }

@media (max-width: 1220px) {
  .app { grid-template-columns: minmax(0, 1fr) 360px; }
  .flow { display: none; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 12px 96px; }
  .top { margin-bottom: 4px; }
  .bar { display: none; }
  .brand span { display: none; }
  .notes { position: static; }
  .notes h2 { font-size: 30px; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--table); border-top: 1px solid var(--line); }
  .nav .btn { flex: 1; justify-content: center; }
  .hint { display: none; }
  .board { padding: 20px; border-radius: 20px; }
  .funnel .row { grid-template-columns: 92px 1fr 70px; font-size: 13px; }
  .weights { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts, .checks { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .wall .col { animation: none !important; }
  .hot { animation: none !important; }
  .mark path { stroke-dashoffset: 0; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>Virale</b><span>Prototipo interattivo dell'app</span></div>
    <div class="progress">
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
      <p class="count" id="count" aria-live="polite"></p>
    </div>
  </header>

  <nav class="flow" id="flow" aria-label="Passaggi del prototipo"></nav>

  <main class="stage" id="stage"></main>

  <aside class="notes">
    <div class="notes-body" id="notes"></div>
    <div class="nav">
      <button class="btn" id="prev" type="button"></button>
      <button class="btn primary" id="next" type="button"></button>
    </div>
    <p class="hint">Tocca il riquadro giallo sul telefono per proseguire, oppure usa i tasti freccia della tastiera.</p>
  </aside>
</div>

<script>
/*__MEDIA__*/
const M = window.MEDIA || {};
const V = window.VIDEO || {};

/* ---------------- icone (stesso set dell'app) ---------------- */
const ICONS = {
  copertina: '<rect x="4.5" y="3" width="15" height="18" rx="2"/><path d="M4.5 8.5h15M8 13h5M8 16.5h8"/>',
  provini: '<rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.5"/>',
  scatta: '<path d="M12 5v14M5 12h14"/>',
  archivio: '<rect x="5" y="7" width="14" height="14" rx="2"/><path d="M7.5 4h9M8.5 11.5h7"/>',

function mediaEl(ref) {
  const [kind, name] = ref.split(':');
  if (kind === 'vid') {
    const v = V[name] || {};
    return `<video muted loop playsinline autoplay preload="auto" data-track>${v.webm ? `<source src="${v.webm}" type="video/webm">` : ''}${v.mp4 ? `<source src="${v.mp4}" type="video/mp4">` : ''}</video>`;
  }
  return `<img src="${M[name] || ''}" alt="" draggable="false">`;
}

function tabbar(active) {

}

function frame(media, { stamp, h, rounded = true } = {}) {
  const many = media.length > 1;
  const isVid = media[0].startsWith('vid:');
  return `<div class="frame" style="height:${h}px;${rounded ? '' : 'border-radius:0'}" data-frame>
    <div class="slides" data-slides>${media.map((m) => `<div class="slide">${mediaEl(m)}${m.startsWith('vid:') ? '<div class="track"><i></i></div>' : ''}</div>`).join('')}</div>
    ${isVid ? `<div class="sound">${icon('muto', 20, 'var(--paper)')}</div>` : ''}
    ${many ? `<div class="counter" data-counter>1 / ${media.length}</div><div class="dots" data-dots>${media.map((_, i) => `<b class="${i === 0 ? 'on' : ''}"></b>`).join('')}</div>` : ''}
    ${stamp ? `<div class="stamp">In gara · ${stamp}</div>` : ''}
  </div>`;
}

      <span class="act ${saved ? 'on-yellow' : ''}">${icon('salva', 24, saved ? 'var(--giallo)' : 'var(--paper)', saved ? 2.4 : 1.75, saved ? 'var(--giallo)' : 'none')}${fmt(p.saves + (saved ? 1 : 0))}</span>

}

function ladder(stage, views, next) {
  const names = ['Provino', 'Bozza', 'Impaginato', 'In macchina', 'Finale'];
  return `<div class="ladder">
    <div class="steps">${names.map((n, i) => `<b class="${i === 4 ? 'final' : ''}"><i style="width:${i < stage ? 100 : i === stage ? Math.max(4, views) : 0}%" ${i === stage ? 'data-fill' : ''}></i></b>`).join('')}</div>

  </div>`;
}

/* ---------------- motore del prototipo ---------------- */
const stage = document.getElementById('stage');
const notesEl = document.getElementById('notes');
let current = -1;
let pendingMark = null;
let timers = [];
const clearTimers = () => { timers.forEach((t) => clearTimeout(t)); timers = []; };
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function renderFlow() {
  const chapters = [];
  STEPS.forEach((s, i) => {
    let c = chapters.find((x) => x.name === s.ch);
    if (!c) chapters.push((c = { name: s.ch, items: [] }));
    c.items.push([s, i]);
  });
  document.getElementById('flow').innerHTML = chapters.map((c) => `<section class="chapter"><h3>${c.name}</h3><ol>${c.items.map(([s, i]) => `<li><button type="button" data-go="${i}"><span class="n">${i + 1}</span><span>${s.title}</span></button></li>`).join('')}</ol></section>`).join('');
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(+b.dataset.go)));
}

function fitDevice(device) {
  const wide = window.innerWidth > 860;
  // Su telefono si lascia spazio sotto per l'inizio della spiegazione.
  const availH = wide ? window.innerHeight - 120 : window.innerHeight * 0.64;
  const availW = stage.clientWidth;
  const s = Math.min(1, availH / 868, availW / 414);
  device.style.setProperty('--s', Math.max(0.5, s).toFixed(3));
}

function go(i) {
  if (i < 0 || i >= STEPS.length || i === current) return;
  const forward = i > current;
  clearTimers();
  current = i;
  const step = STEPS[i];

  if (step.board) {
    stage.innerHTML = BOARDS[step.board]();
  } else {
    let device = stage.querySelector('.device');
    if (!device) {
      stage.innerHTML = `<div class="device"><div class="bezel"><div class="phone" id="phone"><div class="island"></div><div class="homebar"></div></div></div></div>`;
      device = stage.querySelector('.device');
    }
    fitDevice(device);
    const phone = document.getElementById('phone');
    phone.querySelectorAll('.screen').forEach((n) => n.remove());
    phone.querySelectorAll('.hot').forEach((n) => n.remove());
    const screen = document.createElement('div');
    screen.className = `screen ${forward ? 'enter' : 'fade'}`;
    screen.innerHTML = SCREENS[step.screen](step.opts || {});
    phone.prepend(screen);
    wire(screen, step);
    if (step.enter) step.enter(screen);
    develop(screen);
    if (step.hot) later(() => placeHot(phone, screen, step), step.wait ? 3600 : 450);
  }

  // Note del passaggio: dissolvenza breve, il testo cambia mentre è invisibile.
  notesEl.classList.add('out');
  later(() => {
    notesEl.innerHTML = `<h2>${step.title}</h2><p class="lead">${step.lead}</p><ul>${step.notes.map((n) => `<li>${icon('dot', 22, 'var(--giallo)')}<span>${n}</span></li>`).join('')}</ul>`;
    notesEl.classList.remove('out');
  }, 120);

  document.getElementById('count').innerHTML = `<strong>${i + 1}</strong> di ${STEPS.length} · ${step.ch}`;
  document.getElementById('bar').style.transform = `scaleX(${(i + 1) / STEPS.length})`;
  document.getElementById('prev').disabled = i === 0;
  const next = document.getElementById('next');
  next.innerHTML = i === STEPS.length - 1 ? 'Ricomincia dall’inizio' : `Avanti ${icon('destra', 20, 'var(--canvas)', 2.2)}`;
  document.querySelectorAll('[data-go]').forEach((b) => {
    const n = +b.dataset.go;
    if (n === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    b.classList.toggle('done', n < i);
  });
  try { history.replaceState(null, '', `#passo-${i + 1}`); } catch (e) { /* frame bloccato: nessun problema */ }
}

function placeHot(phone, screen, step) {
  let { x, y, w, h } = step.hot;
  if (step.hot.sel) {
    const el = screen.querySelector(step.hot.sel);
    if (!el) return;
    const pr = phone.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const s = pr.width / 390;
    x = (r.left - pr.left) / s; y = (r.top - pr.top) / s; w = r.width / s; h = r.height / s;
  }
  const hot = document.createElement('button');
  hot.type = 'button';
  hot.className = `hot ${step.hot.below || y < 120 ? 'below' : ''}`;
  hot.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  hot.setAttribute('aria-label', step.hot.label);
  hot.innerHTML = `<span>${step.hot.label}</span>`;
  if (step.dbl) {
    hot.style.background = 'transparent';
    let lastTap = 0;
    hot.addEventListener('click', (e) => {
      const now = Date.now();
      const pr = phone.getBoundingClientRect();
      const s = pr.width / 390;
      if (now - lastTap < 320) { pendingMark = { x: (e.clientX - pr.left) / s, y: (e.clientY - pr.top) / s }; go(current + 1); }
      lastTap = now;
    });
  } else {
    hot.addEventListener('click', () => go(current + 1));
  }
  phone.appendChild(hot);
}

/* Comportamenti dentro le schermate: carosello, video, doppio tocco, interruttore. */
function wire(screen, step) {
  screen.querySelectorAll('[data-frame]').forEach((fr) => {
    const slides = fr.querySelector('[data-slides]');
    const counter = fr.querySelector('[data-counter]');
    const dots = fr.querySelectorAll('[data-dots] b');
    slides.addEventListener('scroll', () => {
      const i = Math.round(slides.scrollLeft / slides.clientWidth);
      if (counter) counter.textContent = `${i + 1} / ${dots.length}`;
      dots.forEach((d, k) => d.classList.toggle('on', k === i));
    }, { passive: true });
    if (step.free) {
      slides.addEventListener('dblclick', (e) => {
        const pr = screen.getBoundingClientRect();
        const s = pr.width / 390;
        drawMark(screen, (e.clientX - pr.left) / s, (e.clientY - pr.top) / s);
      });
    }
  });
  screen.querySelectorAll('video[data-track]').forEach((v) => {
    const bar = v.parentElement.querySelector('.track i');
    v.addEventListener('timeupdate', () => { if (bar && v.duration) bar.style.transform = `scaleX(${v.currentTime / v.duration})`; });
    v.play().catch(() => {});
  });
  const seg = screen.querySelector('[data-seg]');
  if (seg) seg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    seg.classList.toggle('right', b.dataset.mode === 'seguiti');
    seg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  }));
  const clock = screen.querySelector('[data-clock]');
  if (clock && step.screen !== 'mezzanotte') {
    let left = 7 * 3600 + 42 * 60 + 10;
    const tick = () => { left--; const p = (n) => String(n).padStart(2, '0'); clock.textContent = `${p(Math.floor(left / 3600))}:${p(Math.floor((left % 3600) / 60))}:${p(left % 60)}`; later(tick, 1000); };
    later(tick, 1000);
  }
}

function drawMark(screen, x, y, like = true) {
  if (!screen) return;
  const mark = document.createElement('div');
  mark.className = 'mark';
  mark.style.cssText = `left:${x - 75}px;top:${y - 75}px;z-index:35`;
  mark.innerHTML = '<svg width="150" height="150" viewBox="0 0 150 150"><path d="M108 33c-12-8-28-11-44-7C37 32 20 56 26 80c6 25 33 39 60 33s45-31 39-55c-3-13-11-23-23-29-7-4-15-6-23-6" stroke="#F65041" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
  screen.appendChild(mark);
  setTimeout(() => { mark.style.opacity = '0'; }, 650);
  setTimeout(() => mark.remove(), 900);
  if (like) {
    const l = screen.querySelector('[data-like]');
    if (l && !l.classList.contains('on-red')) {
      l.classList.add('on-red');
      l.querySelector('svg').outerHTML = icon('cerchia', 24, 'var(--matita)', 2.4);
      const n = l.querySelector('[data-like-n]');
      n.textContent = fmt(POSTS.bimbi.likes + 1);
    }
  }
}

function develop(screen) {
  const blur = screen.querySelector('[data-blur]');
  if (blur) requestAnimationFrame(() => requestAnimationFrame(() => { blur.style.opacity = '0'; }));
}

function animateLadder(screen) {
  const box = screen.querySelector('[data-ladder]');
  let views = 0;
  const step = () => {
    views = Math.min(50, views + 7);
    if (views < 50) {
      box.querySelector('[data-fill]').style.width = `${Math.max(4, (views / 50) * 100)}%`;
      box.querySelector('[data-ladder-text]').textContent = `${views} di 50 viste per passare a “Bozza”.`;
      later(step, 450);
    } else {
      box.innerHTML = ladder(1, 6, '64 di 300 viste per passare a “Impaginato”. Ha battuto l’83% dei provini di oggi.');
    }
  };
  later(step, 700);
}

function midnight(screen) {
  const clock = screen.querySelector('[data-clock]');
  [2, 1, 0].forEach((s, k) => later(() => { clock.textContent = `00:00:0${s}`; }, (k + 1) * 900));
  later(() => {
    const d = document.createElement('div');
    d.className = 'dialog';
    d.innerHTML = `<div><span style="font-family:var(--display);font-weight:900;font-size:64px;line-height:1">N. 289</span><p class="txt-heading">Hai vinto tu.</p><p class="dim">Su 12.731 provini, il tuo è salito più in alto. Da adesso è la prima cosa che vede chiunque apra l’app.</p><div class="cta" data-hot="vedi" style="align-self:stretch;margin-top:6px">Guarda la copertina</div></div>`;
    screen.appendChild(d);
  }, 3300);
}

document.getElementById('prev').innerHTML = `${icon('sinistra', 20, 'var(--paper)', 2.2)} Indietro`;
document.getElementById('prev').addEventListener('click', () => go(current - 1));
document.getElementById('next').addEventListener('click', () => (current === STEPS.length - 1 ? go(0) : go(current + 1)));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { e.preventDefault(); current === STEPS.length - 1 ? go(0) : go(current + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(current - 1); }
});
window.addEventListener('hashchange', () => { const m = /^#passo-(\d+)$/.exec(location.hash || ''); if (m) go(Math.min(STEPS.length, Math.max(1, +m[1])) - 1); });
window.addEventListener('resize', () => { const d = stage.querySelector('.device'); if (d) fitDevice(d); });

renderFlow();
const fromHash = /^#passo-(\d+)$/.exec(location.hash || '');
go(fromHash ? Math.min(STEPS.length, Math.max(1, +fromHash[1])) - 1 : 0);
</script>
